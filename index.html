<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gathmo Media Kit</title>
    <meta name="description" content="Media kit and brand assets for Gathmo, a QR-based event media platform.">
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
        color: #111827;
        background: #f8fafc;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      a {
        color: #0f766e;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="assets/gathmo-logo-icon.svg" alt="Gathmo logo">
        <h1>Gathmo Media Kit</h1>
        <p>
          Gathmo is a QR-based event media platform for collecting guest photos,
          videos, and voice messages without requiring guests to install an app.
        </p>
        <p>
          Visit the official website at
          <a href="https://gathmo.com/">https://gathmo.com/</a>.
        </p>
        <ul>
          <li><a href="https://gathmo.com/weddings">Gathmo for weddings</a></li>
          <li><a href="https://gathmo.com/pricing">Gathmo pricing</a></li>
          <li><a href="https://gathmo.com/for-business">Gathmo for business</a></li>
        </ul>
      </div>
    </main>
  </body>
</html>
